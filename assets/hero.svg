<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Notificly process watcher</title>
  <desc id="desc">A local process finishes and Notificly sends a durable notification.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#153b4a"/></linearGradient></defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="80" y="130" width="430" height="260" rx="24" fill="#07111f" stroke="#3b536c" stroke-width="3"/>
    <circle cx="116" cy="166" r="8" fill="#fb7185"/><circle cx="144" cy="166" r="8" fill="#fbbf24"/><circle cx="172" cy="166" r="8" fill="#34d399"/>
    <text x="116" y="235" font-size="28" fill="#67e8f9">$ notify --pid 12345</text><text x="116" y="285" font-size="25" fill="#cbd5e1">waiting for process…</text><text x="116" y="335" font-size="25" fill="#34d399">✓ finished: exit 0</text>
    <path d="M555 260h110" stroke="#67e8f9" stroke-width="10" stroke-linecap="round"/><path d="m640 225 45 35-45 35" fill="none" stroke="#67e8f9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="735" y="130" width="385" height="260" rx="24" fill="#ecfeff"/><text x="785" y="225" font-family="system-ui,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Notify Center</text><text x="785" y="275" font-family="system-ui,sans-serif" font-size="25" fill="#164e63">human alert delivered</text><circle cx="930" cy="340" r="34" fill="#10b981"/><path d="m912 340 13 13 27-31" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="500" font-family="system-ui,sans-serif" font-size="64" font-weight="800" fill="white">Wait locally. Notify reliably.</text><text x="84" y="550" font-family="system-ui,sans-serif" font-size="28" fill="#cbd5e1">A tiny watcher for long-running commands.</text>
  </g>
</svg>
